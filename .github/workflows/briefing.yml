name: Update briefing data
# Fetches METAR, TAF and NOTAMs for the ICAO codes in config.json into data/ICAO.json.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefing
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-briefing.mjs
        env:
          AUTOROUTER_USER: ${{ secrets.AUTOROUTER_USER }}
          AUTOROUTER_PASS: ${{ secrets.AUTOROUTER_PASS }}
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Update briefing data'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
